name: Deploy web to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web app
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Public values (the anon key is meant for browsers; RLS enforces access).
          # Repository Variables of the same name override these defaults.
          VITE_PHONE_OTP: ${{ vars.VITE_PHONE_OTP || 'false' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://wrduxamtdhfumhappuym.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyZHV4YW10ZGhmdW1oYXBwdXltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNTYwNDQsImV4cCI6MjExMDczMjA0NH0._KsmQWkRzGHfTJUevcCNW3sa7XgUh9t4MbWd85q1I8M' }}
      - name: SPA fallback for deep links
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
