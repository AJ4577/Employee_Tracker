# Supabase CLI configuration. Used by `npx supabase start` (local, needs Docker) and pushed to the
# linked project with `npx supabase config push` (auth URLs, OTP email templates, MFA).
# SMTP credentials are NOT stored here — set them in the dashboard (Authentication → Emails → SMTP).
project_id = "kisanroute"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "https://aj4577.github.io/Employee_Tracker/"
additional_redirect_urls = ["https://aj4577.github.io/Employee_Tracker/accept-invite", "http://localhost:5173", "http://localhost:5173/accept-invite", "kisanroute://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Self-registration is allowed (OTP-verified); new accounts stay 'pending' until an admin approves.
enable_signup = true
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
# email_sent is fixed by Supabase until custom SMTP is configured.
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

# Email templates must contain {{ .Token }} so users receive a 6-digit code (not only a link).
# Supabase allows template changes only with custom SMTP (configured in the dashboard, Gmail).
[auth.email.template.magic_link]
subject = "Your KisanRoute sign-in code"
content_path = "./supabase/templates/otp.html"

[auth.email.template.confirmation]
subject = "Your KisanRoute verification code"
content_path = "./supabase/templates/otp.html"

[auth.sms]
# Phone OTP needs an SMS provider (Twilio, MessageBird, Textlocal, Vonage). Turn on after configuring one.
enabled = false
enable_confirmations = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.invite-user]
verify_jwt = true

[functions.admin-staff]
verify_jwt = true

[functions.places]
verify_jwt = true

[functions.send-welcome]
verify_jwt = true

[functions.push-dispatch]
# Called by the scheduler with x-cron-secret; no user JWT.
verify_jwt = false
