# Supabase CLI configuration for local development (`npx supabase start`, needs Docker).
# Production settings (Auth URLs, SMTP, MFA) are configured in the Supabase dashboard — see docs/DEPLOYMENT.md.
project_id = "kisanroute"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/accept-invite", "http://localhost:5173/reset-password", "kisanroute://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Invite-only: no public sign-up.
enable_signup = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
otp_expiry = 86400

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.invite-user]
verify_jwt = true

[functions.admin-staff]
verify_jwt = true

[functions.places]
verify_jwt = true

[functions.push-dispatch]
# Called by the scheduler with x-cron-secret; no user JWT.
verify_jwt = false
